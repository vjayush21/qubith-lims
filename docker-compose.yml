services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lims-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/app/data/lims.db
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    volumes:
      - lims-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/auth/me"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  lims-data:
    driver: local
